name: tests

on:
  push:
  pull_request:

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: pytest tests/test_synthetic_data.py tests/test_knowledge_base.py
